# ---------------------------------------------------------------------------
[env.production]
name = "signa-api-production"
workers_dev = false

[env.production.vars]
APP_ENV = "production"
APP_BASE_URL = "https://signa.example"
API_BASE_URL = "https://api.signa.example"
CORS_ALLOWED_ORIGINS = "https://signa.example"
LOG_LEVEL = "info"
# Delivery stays disabled until a real provider adapter is implemented and configured.
EMAIL_PROVIDER = "disabled"
# No payment provider selected yet: checkout returns `provider_not_configured`.
PAYMENT_PROVIDER = "none"
SIGN_PROVIDER = "dictionary_lookup"
SIGN_PROVIDER_VALIDATED = "false"
SIGN_SYNC_FALLBACK_MAX_CHARS = "280"
SIGN_RESULT_TTL_SECONDS = "3600"

[[env.production.d1_databases]]
binding = "DB"
database_name = "signa-db-production"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "signa-assets-production"

[[env.production.queues.producers]]
binding = "SIGN_JOBS_QUEUE"
queue = "signa-sign-jobs-production"

[[env.production.queues.consumers]]
queue = "signa-sign-jobs-production"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "signa-sign-jobs-production-dlq"

[[env.production.queues.consumers]]
queue = "signa-sign-jobs-production-dlq"
max_retries = 1

[env.production.triggers]
crons = ["*/10 * * * *"]
