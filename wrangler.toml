# Signa API — Cloudflare Worker configuration.
# Secrets are NOT stored here. Set them with `wrangler secret put <NAME> [--env <env>]`:
#   APP_SECRET (required, ≥ 32 random chars), DEV_PAYMENT_WEBHOOK_SECRET (dev payments only),
#   SIGN_PROVIDER_API_KEY (http sign provider), GOOGLE_CLIENT_SECRET (optional OAuth).
# For local development copy .dev.vars.example to .dev.vars.

name = "signa-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

# The web app (Next.js static export in ./web) is built on every deploy and served
# as static assets from this same Worker, so the site and the API share one origin.
[build]
command = "npm run build:web"

[assets]
directory = "./web/out"
not_found_handling = "404-page"
# Only API/health routes run the Worker; everything else is served from static assets.
run_worker_first = ["/api/*", "/health*", "/ready*"]

[vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:3000"
API_BASE_URL = "http://localhost:8787"
CORS_ALLOWED_ORIGINS = "http://localhost:3000"
LOG_LEVEL = "info"
EMAIL_PROVIDER = "dev"
PAYMENT_PROVIDER = "dev"
SIGN_PROVIDER = "dictionary_lookup"
SIGN_PROVIDER_VALIDATED = "false"
SIGN_SYNC_FALLBACK_MAX_CHARS = "280"
SIGN_RESULT_TTL_SECONDS = "3600"

[[d1_databases]]
binding = "DB"
database_name = "signa-db"
database_id = "00000000-0000-0000-0000-000000000000" # replace after `wrangler d1 create signa-db`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "signa-assets"

[[queues.producers]]
binding = "SIGN_JOBS_QUEUE"
queue = "signa-sign-jobs"

[[queues.consumers]]
queue = "signa-sign-jobs"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "signa-sign-jobs-dlq"

[[queues.consumers]]
queue = "signa-sign-jobs-dlq"
max_batch_size = 10
max_retries = 1

[triggers]
crons = ["*/10 * * * *"]

# ---------------------------------------------------------------------------
[env.staging]
name = "signa-api-staging"
